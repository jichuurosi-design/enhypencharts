name: Run Kworb Spotify Scraper

on:
  schedule:
    # Se ejecuta todos los días a las 23:00 UTC 
    # (Que equivale exactamente a las 18:00 / 6:00 PM hora de Ecuador)
    - cron: '0 23 * * *'
  workflow_dispatch: # Activa el botón gris en la web para pruebas manuales

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Depurar y listar archivos en raiz
        run: ls -la

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerias necesarias
        run: |
          pip install requests beautifulsoup4 supabase lxml

      - name: Ejecutar Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        # Forzamos al sistema a buscar en la raíz exacta del espacio de trabajo
        run: python "$GITHUB_WORKSPACE/scraper.py"
